[pytest]
# Disable web3's bundled pytest plugin: web3 6.15.1 ships web3.tools.pytest_ethereum,
# which does `from eth_typing import ContractName` — removed in eth-typing >=4, so
# pytest's autoload of it crashes the whole run. These smoke tests don't need it.
addopts = -ra -p no:pytest_ethereum
python_files = test_*.py
