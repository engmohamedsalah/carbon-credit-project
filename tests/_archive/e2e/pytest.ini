[pytest]
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --browser chromium
    --video=retain-on-failure
    --screenshot=only-on-failure
    --ignore=../tests
    --ignore=../tests/test_api_comprehensive.py
    --ignore=../test_api_comprehensive.py
    --ignore=ml
    --ignore=tests/test_iot_integration.py
    --ignore=tests/test_xai_api_only.py
    --ignore=tests/test_xai_functionality.py
    --ignore=tests/test_performance.py
    --ignore=tests/test_api_comprehensive.py
    --ignore=test_user_workflow.py
    --ignore=test_gap_fixes.py
    -k "test_authentication or test_auth_failures or test_dashboard_loads_after_login or test_dashboard_shows_user_projects or test_dashboard_navigation"
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    auth: marks tests related to authentication
    auth_failures: marks tests related to authentication failures
    dashboard: marks tests related to dashboard functionality
    ui: marks tests related to user interface
    accessibility: marks tests related to accessibility
    workflow: marks tests related to complete user workflows
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning 